[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "state-model-interface"
version = "0.1.0"
description = "Secure token-ID compiler for the State Model Interface"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
train = [
    "datasets>=5,<6",
    "tensorboard>=2.20,<3",
    "torch>=2.8,<2.9",
    "transformers>=5.15,<6",
    "trl>=1.10,<1.11",
]

[project.scripts]
smi-train-rwkv7 = "state_model_interface.train_rwkv7:main"

[dependency-groups]
dev = [
    "datasets>=5,<6",
    "pyright>=1.1.403",
    "pytest>=8.0",
    "ruff>=0.9",
    "tensorboard>=2.20,<3",
    "torch>=2.8,<2.9",
    "transformers>=5.15,<6",
    "trl>=1.10,<1.11",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["README.md"]
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I", "UP"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"

[tool.hatch.build.targets.wheel.force-include]
"chat_template.jinja" = "state_model_interface/chat_template.jinja"
